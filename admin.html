<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin NOSZONA Smart</title>

<style>
:root {
  --primary: #062b4f;
  --primary-light: #0b4f88;
  --accent: #00a8c8;
  --gold: #f6c247;
  --bg: #f4f7fb;
  --card: #ffffff;
  --text: #122033;
  --muted: #6b7280;
  --border: #dbe4ef;
  --success: #0f9f6e;
  --warning: #f59e0b;
  --danger: #c62828;
  --shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

header {
  background:
    radial-gradient(circle at top left, rgba(0,168,200,0.25), transparent 35%),
    linear-gradient(135deg, #062b4f 0%, #0b4f88 70%, #0b8ea8 100%);
  color: white;
  padding: 28px 7%;
  box-shadow: 0 8px 28px rgba(0,0,0,0.18);
}

.header-content {
  max-width: 1250px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: center;
  flex-wrap: wrap;
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo-mark {
  width: 50px;
  height: 50px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--accent), var(--gold));
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 20px;
  color: white;
  box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

.logo-area h1 {
  margin: 0;
  font-size: 26px;
}

.logo-area p {
  margin: 4px 0 0;
  color: rgba(255,255,255,0.82);
  font-size: 14px;
}

.header-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.container {
  max-width: 1250px;
  margin: auto;
  padding: 35px 7%;
}

.topbar {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  align-items: center;
  margin-bottom: 25px;
  flex-wrap: wrap;
}

.topbar h2 {
  margin: 0;
  color: var(--primary);
  font-size: 30px;
}

.topbar p {
  color: var(--muted);
  margin: 6px 0 0;
}

button {
  font-family: inherit;
  border: none;
  cursor: pointer;
  font-weight: 800;
  transition: 0.25s ease;
}

.btn {
  padding: 12px 18px;
  border-radius: 12px;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--primary-light));
  color: white;
  box-shadow: 0 8px 18px rgba(0,168,200,0.25);
}

.btn-outline {
  background: white;
  color: var(--primary);
  border: 1px solid var(--border);
}

.btn-danger {
  background: var(--danger);
  color: white;
}

.btn-success {
  background: var(--success);
  color: white;
}

.btn-warning {
  background: var(--warning);
  color: white;
}

.btn:hover {
  transform: translateY(-2px);
  opacity: 0.95;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  margin-bottom: 28px;
}

.stat-card {
  background: white;
  border-radius: 22px;
  padding: 22px;
  border: 1px solid var(--border);
  box-shadow: 0 12px 35px rgba(15,23,42,0.08);
}

.stat-card span {
  color: var(--muted);
  font-size: 14px;
}

.stat-card strong {
  display: block;
  margin-top: 8px;
  font-size: 30px;
  color: var(--primary);
}

.tools {
  background: white;
  border-radius: 22px;
  padding: 18px;
  border: 1px solid var(--border);
  box-shadow: 0 12px 35px rgba(15,23,42,0.08);
  margin-bottom: 25px;
  display: grid;
  grid-template-columns: 1fr 220px;
  gap: 14px;
}

input, select {
  width: 100%;
  padding: 13px 14px;
  border: 1px solid var(--border);
  border-radius: 14px;
  font-size: 15px;
  background: #fbfdff;
  outline: none;
}

input:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(0,168,200,0.12);
}

#lista {
  display: grid;
  grid-template-columns: 1fr;
  gap: 22px;
}

.card {
  background: var(--card);
  border-radius: 26px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.card-header {
  padding: 22px 26px;
  background: linear-gradient(135deg, #ffffff, #eef8fb);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  gap: 18px;
  align-items: center;
  flex-wrap: wrap;
}

.resident-title {
  display: flex;
  align-items: center;
  gap: 14px;
}

.avatar {
  width: 54px;
  height: 54px;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--primary-light), var(--accent));
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 20px;
}

.card-header h3 {
  margin: 0;
  font-size: 22px;
  color: var(--primary);
}

.card-header p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 14px;
}

.card-body {
  padding: 26px;
}

.info-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}

.info-box {
  background: #f8fbff;
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 15px;
  min-height: 78px;
}

.info-box span {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 700;
}

.info-box strong {
  color: var(--primary);
  font-size: 15px;
  word-break: break-word;
}

.status-chip {
  display: inline-flex;
  padding: 8px 13px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 900;
}

.status-pendente {
  background: #fff7e6;
  color: var(--warning);
}

.status-ativo {
  background: #e9fff6;
  color: var(--success);
}

.status-inativo {
  background: #f3f4f6;
  color: var(--muted);
}

.pedido-alerta {
  margin-top: 20px;
  padding: 16px;
  border-radius: 18px;
  background: #fff7e6;
  border: 1px solid #ffd890;
  color: #7c4a03;
  font-weight: 700;
}

.admin-actions {
  margin-top: 24px;
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  gap: 12px;
  align-items: center;
}

.uid-input {
  margin: 0;
}

.empty-state {
  background: white;
  border-radius: 24px;
  padding: 45px;
  text-align: center;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}

.empty-state h3 {
  color: var(--primary);
  margin-bottom: 8px;
}

.empty-state p {
  color: var(--muted);
}

.footer {
  text-align: center;
  color: var(--muted);
  padding: 25px;
}

.loading {
  opacity: 0.6;
  pointer-events: none;
}

.danger-zone {
  margin-top: 20px;
  padding: 18px;
  background: #fff5f5;
  border: 1px solid #ffd2d2;
  border-radius: 18px;
}

.danger-zone h4 {
  margin: 0 0 8px;
  color: var(--danger);
}

.danger-zone p {
  margin: 0 0 12px;
  color: #7f1d1d;
  font-size: 14px;
}

@media (max-width: 1050px) {
  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .info-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .admin-actions {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 650px) {
  header {
    padding: 22px 5%;
  }

  .container {
    padding: 28px 5%;
  }

  .stats-grid {
    grid-template-columns: 1fr;
  }

  .info-grid {
    grid-template-columns: 1fr;
  }

  .tools {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo-area">
      <div class="logo-mark">NZ</div>
      <div>
        <h1>Painel de Administração</h1>
        <p>NOSZONA Smart · Gestão de Residentes, QR e RFID</p>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn btn-outline" onclick="carregarResidentes()">Atualizar</button>
    </div>
  </div>
</header>

<main class="container">

  <div class="topbar">
    <div>
      <h2>Residentes registados</h2>
      <p>Gestão completa de contas, pacotes, QR permanente e cartões RFID.</p>
    </div>
  </div>

  <section class="stats-grid">
    <div class="stat-card">
      <span>Total de residentes</span>
      <strong id="statTotal">0</strong>
    </div>

    <div class="stat-card">
      <span>Cartões ativos</span>
      <strong id="statAtivos">0</strong>
    </div>

    <div class="stat-card">
      <span>Pedidos de cartão</span>
      <strong id="statPedidos">0</strong>
    </div>

    <div class="stat-card">
      <span>Total de swipes</span>
      <strong id="statSwipes">0</strong>
    </div>
  </section>

  <section class="tools">
    <input id="pesquisa" placeholder="Pesquisar por nome, username, documento, pacote ou UID..." oninput="filtrarResidentes()">

    <select id="filtroEstado" onchange="filtrarResidentes()">
      <option value="todos">Todos os estados</option>
      <option value="ativo">Ativos</option>
      <option value="pendente">Pendentes</option>
      <option value="cartao">Com cartão gerado</option>
      <option value="pedido">Com pedido de cartão</option>
    </select>
  </section>

  <div id="lista"></div>

</main>

<footer class="footer">
  <p>Smart City Cabo Verde · NOSZONA Smart Admin</p>
</footer>

<script>
let residentesCache = [];

function setLoading(isLoading) {
  document.body.classList.toggle("loading", isLoading);
}

function formatarValor(valor, vazio = "N/A") {
  if (valor === undefined || valor === null || valor === "") {
    return vazio;
  }
  return valor;
}

function getIniciais(nome) {
  if (!nome) return "NZ";

  return nome
    .split(" ")
    .map(p => p[0])
    .join("")
    .substring(0, 2)
    .toUpperCase();
}

function normalizarBoolean(valor) {
  return valor === true || valor === 1 || valor === "1";
}

function getStatusClass(estado) {
  if (estado === "ativo") return "status-ativo";
  if (estado === "pendente") return "status-pendente";
  return "status-inativo";
}

async function carregarResidentes() {
  try {
    setLoading(true);

    const resposta = await fetch("/api/admin/residentes");
    const residentes = await resposta.json();

    residentesCache = Array.isArray(residentes) ? residentes : [];

    atualizarEstatisticas(residentesCache);
    renderizarResidentes(residentesCache);

  } catch (erro) {
    document.getElementById("lista").innerHTML = `
      <div class="empty-state">
        <h3>Erro de ligação</h3>
        <p>Não foi possível comunicar com o Node-RED.</p>
      </div>
    `;
  } finally {
    setLoading(false);
  }
}

function atualizarEstatisticas(residentes) {
  const total = residentes.length;

  const ativos = residentes.filter(r => r.estado === "ativo").length;

  const pedidos = residentes.filter(r =>
    normalizarBoolean(r.pedidoCartao) ||
    r.estadoPedidoCartao === "pendente"
  ).length;

  const swipes = residentes.reduce((acc, r) => acc + Number(r.swipes || 0), 0);

  document.getElementById("statTotal").innerText = total;
  document.getElementById("statAtivos").innerText = ativos;
  document.getElementById("statPedidos").innerText = pedidos;
  document.getElementById("statSwipes").innerText = swipes;
}

function filtrarResidentes() {
  const termo = document.getElementById("pesquisa").value.toLowerCase();
  const filtro = document.getElementById("filtroEstado").value;

  let filtrados = residentesCache.filter(r => {
    const texto = `
      ${r.nome || ""}
      ${r.username || ""}
      ${r.documento || ""}
      ${r.pacote || ""}
      ${r.uid || ""}
      ${r.email || ""}
      ${r.telefone || ""}
      ${r.estadoPedidoCartao || ""}
    `.toLowerCase();

    const combinaPesquisa = texto.includes(termo);
    let combinaFiltro = true;

    if (filtro === "ativo") {
      combinaFiltro = r.estado === "ativo";
    }

    if (filtro === "pendente") {
      combinaFiltro = r.estado === "pendente";
    }

    if (filtro === "cartao") {
      combinaFiltro = normalizarBoolean(r.cartaoGerado) || !!r.uid;
    }

    if (filtro === "pedido") {
      combinaFiltro = normalizarBoolean(r.pedidoCartao) || r.estadoPedidoCartao === "pendente";
    }

    return combinaPesquisa && combinaFiltro;
  });

  renderizarResidentes(filtrados);
}

function renderizarResidentes(residentes) {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  if (residentes.length === 0) {
    lista.innerHTML = `
      <div class="empty-state">
        <h3>Nenhum residente encontrado</h3>
        <p>Ainda não existem residentes registados ou o filtro não encontrou resultados.</p>
      </div>
    `;
    return;
  }

  residentes.forEach(r => {
    const pedidoPendente = normalizarBoolean(r.pedidoCartao) || r.estadoPedidoCartao === "pendente";
    const temCartao = normalizarBoolean(r.cartaoGerado) || !!r.uid;

    lista.innerHTML += `
      <div class="card">
        <div class="card-header">
          <div class="resident-title">
            <div class="avatar">${getIniciais(r.nome)}</div>
            <div>
              <h3>${formatarValor(r.nome, "Sem nome")}</h3>
              <p>${formatarValor(r.username, "Sem username")} · ${formatarValor(r.pacote, "Sem pacote")}</p>
            </div>
          </div>

          <span class="status-chip ${getStatusClass(r.estado)}">
            ${formatarValor(r.estado, "sem estado")}
          </span>
        </div>

        <div class="card-body">

          ${pedidoPendente ? `
            <div class="pedido-alerta">
              🎫 Este residente solicitou cartão físico. Estado do pedido: ${formatarValor(r.estadoPedidoCartao, "pendente")}
            </div>
          ` : ""}

          <div class="info-grid">
            <div class="info-box">
              <span>Data de nascimento</span>
              <strong>${formatarValor(r.dataNascimento)}</strong>
            </div>

            <div class="info-box">
              <span>Nacionalidade</span>
              <strong>${formatarValor(r.nacionalidade)}</strong>
            </div>

            <div class="info-box">
              <span>Documento</span>
              <strong>${formatarValor(r.documento)}</strong>
            </div>

            <div class="info-box">
              <span>Telefone</span>
              <strong>${formatarValor(r.telefone)}</strong>
            </div>

            <div class="info-box">
              <span>Email</span>
              <strong>${formatarValor(r.email)}</strong>
            </div>

            <div class="info-box">
              <span>Morada</span>
              <strong>${formatarValor(r.morada)}</strong>
            </div>

            <div class="info-box">
              <span>Município</span>
              <strong>${formatarValor(r.municipio)}</strong>
            </div>

            <div class="info-box">
              <span>Pacote</span>
              <strong>${formatarValor(r.pacote)}</strong>
            </div>

            <div class="info-box">
              <span>Saldo</span>
              <strong>${Number(r.saldo || 0)} CVE</strong>
            </div>

            <div class="info-box">
              <span>Swipes</span>
              <strong>${Number(r.swipes || 0)}</strong>
            </div>

            <div class="info-box">
              <span>Parking</span>
              <strong>${normalizarBoolean(r.parking) ? "Sim" : "Não"}</strong>
            </div>

            <div class="info-box">
              <span>Eventos</span>
              <strong>${normalizarBoolean(r.eventos) ? "Sim" : "Não"}</strong>
            </div>

            <div class="info-box">
              <span>Pedido de cartão</span>
              <strong>${pedidoPendente ? "Sim" : "Não solicitado"}</strong>
            </div>

            <div class="info-box">
              <span>Estado do pedido</span>
              <strong>${formatarValor(r.estadoPedidoCartao, "não solicitado")}</strong>
            </div>

            <div class="info-box">
              <span>UID RFID</span>
              <strong>${formatarValor(r.uid, "Ainda sem cartão")}</strong>
            </div>

            <div class="info-box">
              <span>QR Token</span>
              <strong>${formatarValor(r.qrToken, "Sem QR")}</strong>
            </div>

            <div class="info-box">
              <span>Pagamento</span>
              <strong>${formatarValor(r.pagamentoStatus, "sem informação")}</strong>
            </div>

            <div class="info-box">
              <span>Valor pago</span>
              <strong>${Number(r.valorPago || 0)} CVE</strong>
            </div>

            <div class="info-box">
              <span>Cartão pagamento</span>
              <strong>${r.ultimos4Cartao ? "**** " + r.ultimos4Cartao : "N/A"}</strong>
            </div>

            <div class="info-box">
              <span>Cartão RFID</span>
              <strong>${temCartao ? "Gerado" : "Ainda não gerado"}</strong>
            </div>
          </div>

          <div class="admin-actions">
            <input class="uid-input" id="uid_${r.id}" placeholder="Digite o UID do cartão RFID">

            <button class="btn btn-outline" onclick="buscarUIDAutomatico('${r.id}')">
              Ler RFID
            </button>

            <button class="btn btn-success" onclick="gerarCartao('${r.id}', '${String(r.nome || "").replace(/'/g, "\\'")}')">
              ${temCartao ? "Atualizar Cartão" : "Gerar Cartão"}
            </button>

            <button class="btn btn-outline" onclick="copiarQR('${r.qrToken || ""}')">
              Copiar QR
            </button>
          </div>

          <div class="danger-zone">
            <h4>Zona de risco</h4>
            <p>Esta ação elimina definitivamente o residente e todas as suas informações do sistema.</p>
            <button class="btn btn-danger" onclick="eliminarResidente('${r.id}')">
              Eliminar Cliente e Todos os Dados
            </button>
          </div>
        </div>
      </div>
    `;
  });
}

async function buscarUIDAutomatico(id) {
  try {
    const resposta = await fetch("/api/rfid/ultimo-uid");
    const dados = await resposta.json();

    if (!dados.sucesso) {
      alert(dados.mensagem || "Nenhum UID encontrado. Aproxima o cartão no leitor RFID.");
      return;
    }

    document.getElementById("uid_" + id).value = dados.uid;

    alert("UID lido automaticamente: " + dados.uid);

  } catch (erro) {
    alert("Erro ao buscar UID do leitor RFID.");
  }
}

async function gerarCartao(id, nome) {
  const input = document.getElementById("uid_" + id);
  const uid = input.value.trim();

  if (!uid) {
    alert("Digite o UID manualmente ou clique em Ler RFID.");
    return;
  }

  try {
    const resposta = await fetch("/api/admin/gerar-cartao", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ id, uid })
    });

    const dados = await resposta.json();

    if (dados.sucesso) {
      alert(dados.mensagem || ("Cartão do cliente " + nome + " gerado com sucesso!"));

      input.value = "";

      await limparUIDRFID();

    } else {
      alert(dados.mensagem || "Erro ao gerar cartão.");
    }

    carregarResidentes();

  } catch (erro) {
    alert("Erro ao comunicar com o Node-RED.");
  }
}

async function limparUIDRFID() {
  try {
    await fetch("/api/rfid/limpar-uid", {
      method: "POST",
      headers: {"Content-Type": "application/json"}
    });
  } catch (erro) {
    console.log("UID já foi limpo na Resposta Gerar Cartão ou endpoint limpar-uid não existe.");
  }
}

async function eliminarResidente(id) {
  if (!confirm("Tens certeza que queres eliminar este cliente e todas as informações do sistema?")) {
    return;
  }

  if (!confirm("Confirmação final: esta ação não pode ser desfeita. Queres continuar?")) {
    return;
  }

  try {
    const resposta = await fetch("/api/admin/eliminar-residente", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ id })
    });

    const dados = await resposta.json();
    alert(dados.mensagem);

    carregarResidentes();

  } catch (erro) {
    alert("Erro ao comunicar com o Node-RED.");
  }
}

function copiarQR(qrToken) {
  if (!qrToken) {
    alert("Este residente não tem QR Token.");
    return;
  }

  navigator.clipboard.writeText(qrToken)
    .then(() => alert("QR Token copiado com sucesso."))
    .catch(() => alert("Não foi possível copiar o QR Token."));
}

carregarResidentes();
</script>

</body>
</html>
